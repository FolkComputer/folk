name = "folk-connect"
main = "server/worker.js"
compatibility_date = "2025-06-01"

# Uncomment and edit once the DNS zone is on this Cloudflare account:
# routes = [{ pattern = "connect.folk.computer", custom_domain = true }]

[assets]
directory = "web"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
